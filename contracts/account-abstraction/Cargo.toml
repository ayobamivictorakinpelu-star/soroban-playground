[package]
name = "account-abstraction"
version = "0.1.0"
edition = "2021"
description = "Soroban account authenticator for WebAuthn secp256r1 passkeys"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "22.0.0"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true